<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <defs>
    <linearGradient id="bg-park-jin-seob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2032"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
  </defs>
  <rect width="300" height="340" fill="url(#bg-park-jin-seob)"/>

  <!-- subtle taegeuk watermark -->
  <g transform="translate(225,55)" opacity="0.16">
    <circle r="40" fill="#ffffff"/>
    <path d="M0,-40 A20,20 0 0 1 20,-20 A20,20 0 0 0 40,0 A40,40 0 0 0 0,-40 Z" fill="#1b2032"/>
    <path d="M0,40 A20,20 0 0 1 -20,20 A20,20 0 0 0 -40,0 A40,40 0 0 0 0,40 Z" fill="#0047A0"/>
    <path d="M0,-40 A40,40 0 0 0 0,40 A20,20 0 0 0 20,20 A20,20 1 1 1 0,-40 Z" fill="#1b2032"/>
    <path d="M0,40 A40,40 0 0 0 0,-40 A20,20 0 0 0 -20,-20 A20,20 1 1 1 0,40 Z" fill="#0047A0"/>
  </g>

  <!-- jersey number, large background -->
  <text x="150" y="195" font-family="Poppins, Arial, sans-serif" font-size="190" font-weight="800"
        fill="#ffffff" opacity="0.10" text-anchor="middle">3</text>

  <!-- silhouette -->
  <circle cx="150" cy="118" r="46" fill="#ffffff" opacity="0.96"/>
  <path d="M70,300 C70,224 100,196 150,196 C200,196 230,224 230,300 Z" fill="#ffffff" opacity="0.96"/>

  <!-- initials on the silhouette head -->
  <text x="150" y="132" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="800"
        fill="#1b2032" text-anchor="middle">PS</text>

  <!-- jersey number badge -->
  <circle cx="252" cy="300" r="30" fill="#1b2032" stroke="#ffffff" stroke-width="3"/>
  <text x="252" y="311" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="800"
        fill="#ffffff" text-anchor="middle">3</text>

  <!-- position tag -->
  <rect x="14" y="14" width="62" height="26" rx="13" fill="rgba(255,255,255,0.18)"/>
  <text x="45" y="32" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">DEF</text>
</svg>
