<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" preserveAspectRatio="xMidYMid slice">
  <rect width="1800" height="1000" fill="#ffffff"/>

  <!-- Taegeuk circle, centered -->
  <g transform="translate(900,500)">
    <circle r="190" fill="#ffffff"/>
    <!-- red swirl (top) -->
    <path d="M0,-190 A95,95 0 0 1 95,-95 A95,95 0 0 0 190,0 A190,190 0 0 0 0,-190 Z" fill="#CD2E3A"/>
    <!-- blue swirl (bottom) -->
    <path d="M0,190 A95,95 0 0 1 -95,95 A95,95 0 0 0 -190,0 A190,190 0 0 0 0,190 Z" fill="#0047A0"/>
    <path d="M0,-190 A190,190 0 0 0 0,190 A95,95 0 0 0 95,95 A95,95 0 1 1 0,-190 Z" fill="#CD2E3A"/>
    <path d="M0,190 A190,190 0 0 0 0,-190 A95,95 0 0 0 -95,-95 A95,95 0 1 1 0,190 Z" fill="#0047A0"/>
  </g>

  <!-- 4 trigrams (Geon, Ri, Gam, Gon) closer to corners -->
  <g fill="#000000">
    <!-- top-left: Geon (heaven) - 3 solid lines -->
    <g transform="translate(330,260)">
      <rect x="-85" y="-58" width="170" height="23"/>
      <rect x="-85" y="-12" width="170" height="23"/>
      <rect x="-85" y="34" width="170" height="23"/>
    </g>
    <!-- bottom-right: Gon (earth) - 3 broken lines -->
    <g transform="translate(1470,740)">
      <rect x="-85" y="-58" width="72" height="23"/>
      <rect x="13" y="-58" width="72" height="23"/>
      <rect x="-85" y="-12" width="72" height="23"/>
      <rect x="13" y="-12" width="72" height="23"/>
      <rect x="-85" y="34" width="72" height="23"/>
      <rect x="13" y="34" width="72" height="23"/>
    </g>
    <!-- top-right: Ri (fire) -->
    <g transform="translate(1470,260)">
      <rect x="-85" y="-58" width="170" height="23"/>
      <rect x="-85" y="-12" width="72" height="23"/>
      <rect x="13" y="-12" width="72" height="23"/>
      <rect x="-85" y="34" width="170" height="23"/>
    </g>
    <!-- bottom-left: Gam (water) -->
    <g transform="translate(330,740)">
      <rect x="-85" y="-58" width="72" height="23"/>
      <rect x="13" y="-58" width="72" height="23"/>
      <rect x="-85" y="-12" width="170" height="23"/>
      <rect x="-85" y="34" width="72" height="23"/>
      <rect x="13" y="34" width="72" height="23"/>
    </g>
  </g>
</svg>
